name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The app works with no AI keys. CI proves it, instead of quietly assuming it.
  AI_MODE: auto
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests and evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and contract tests
        run: pnpm test

      - name: Offline evals (thresholds enforced)
        run: pnpm eval

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: docs/eval-report.md
          if-no-files-found: warn

      - name: Build web app
        run: pnpm build

  postgres:
    name: Postgres 18 parity (migrations, RLS, ledger)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ledgerpilot
      AI_MODE: auto
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate and seed a real Postgres
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Verify isolation and the audit ledger
        run: pnpm db:verify

      # The socket test is skipped locally when DATABASE_URL is empty. Here it is
      # not: this runs the same pg wire-protocol path a deployed instance uses.
      - name: Socket contract test against Postgres
        run: pnpm --filter @ledgerpilot/db test
